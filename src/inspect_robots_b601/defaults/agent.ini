# Defaults for `inspect-robots-b601 agent`; pass your own with --inspect-config.
[defaults]
embodiment = b601
policy = agent
rerun = false
rerun_save = false
max_steps = 20

[policy.args]
model = openai/gpt-6-astra
wire = responses
effort = low
# The agent plans steps at 70% (max_speed_frac / 0.1) of the embodiment's declared
# step_size (0.1 rad), so a 10 s move_joints call reaches about 0.7 rad.
max_speed_frac = 0.07
max_llm_calls = 3
transcript_echo = true

[embodiment.args]
state_dir = .hardware-state
allow_motion = false
activate_on_reset = false
operator_supported_arm = false
control_hz = 1.0
max_step = 0.5
camera = realsense+depth:640x480@30

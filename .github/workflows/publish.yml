name: Publish to PyPI
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing immutable version tag, for example v0.3.0'
        required: true
        type: string
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: git show-ref --verify "refs/tags/$RELEASE_TAG"
      - run: python -m pip install -e '.[dev,realtime]'
      - run: python -m scripts.check_version --tag "$RELEASE_TAG"
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: python -m mypy
      - run: python -m pytest --cov
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Validate the installable wheel
        run: |
          python -m venv "$RUNNER_TEMP/wheel"
          "$RUNNER_TEMP/wheel/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/wheel/bin/python" -I tests/packaging/test_installed.py
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-distributions
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: pypi
      url: https://pypi.org/project/inspect-robots-b601/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

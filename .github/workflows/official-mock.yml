name: Official Seeed mock
on: workflow_dispatch
permissions:
  contents: read
jobs:
  official-mock:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    container: ros:humble-ros-base
    steps:
      - uses: actions/checkout@v4
      - name: Install simulation-only ROS dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git python3-pip python3-venv python3-colcon-common-extensions ros-humble-control-msgs ros-humble-robot-state-publisher ros-humble-moveit ros-humble-moveit-configs-utils ros-humble-moveit-kinematics ros-humble-moveit-planners-ompl ros-humble-moveit-simple-controller-manager ros-humble-ros2-control ros-humble-ros2-controllers ros-humble-xacro ros-humble-rmw-cyclonedds-cpp
      - name: Build only the pinned description and mock configuration packages
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          git init /tmp/b601-mock-source
          git -C /tmp/b601-mock-source remote add origin https://github.com/Seeed-Projects/reBotArmController_ROS2.git
          git -C /tmp/b601-mock-source fetch --depth 1 origin 7506dc0fc5c2a7787dcb974d89d13f9f49d16d61
          git -C /tmp/b601-mock-source checkout --detach FETCH_HEAD
          mkdir -p /tmp/b601-mock-overlay
          cd /tmp/b601-mock-overlay
          colcon build --base-paths /tmp/b601-mock-source/src/rebotarm_bringup /tmp/b601-mock-source/src/rebotarm_moveit_config --packages-select rebotarm_bringup rebotarm_moveit_config
      - name: Install the package, with no motor SDK or model client
        shell: bash
        run: |
          python3 -m venv --system-site-packages .venv
          source .venv/bin/activate
          python -m pip install 'pip==25.3'
          python -m pip install .
      - name: Verify mock identity and measured hold/nudge results
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source /tmp/b601-mock-overlay/install/setup.bash
          source .venv/bin/activate
          export ROS_DOMAIN_ID=61 ROS_LOCALHOST_ONLY=1 RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
          unset ROS_DISCOVERY_SERVER ROS_STATIC_PEERS
          python scripts/smoke-official-mock.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-mock-evidence
          path: logs/

[build-system]
requires = ["hatchling>=1.18", "hatch-vcs>=0.3", "hatch-fancy-pypi-readme>=24.1"]
build-backend = "hatchling.build"

[project]
name = "inspect-robots-b601"
dynamic = ["version", "readme"]
description = "Inspect Robots adapter for Seeed reBot Arm B601-RS arms driven directly over SocketCAN."
requires-python = ">=3.10,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "RoboCurve" }]
keywords = ["robotics", "vla", "b601", "rebot-arm", "robstride", "socketcan", "inspect-robots"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = ["inspect-robots>=0.60", "numpy>=1.24,<3", "pillow>=10,<13"]

[project.optional-dependencies]
# The RobStride motor driver over SocketCAN. Pinned: the session relies on its 0.5.6 API.
motorbridge = ["motorbridge==0.5.6"]
# Inspect Robots's LLM agent policy, used by `inspect-robots-b601 agent`.
agent = ["inspect-robots-agent>=0.28"]
dev = ["pytest>=8.0", "mypy>=1.11", "build>=1.2"]

[project.urls]
Homepage = "https://github.com/kyeshmz/inspect-robots-b601"
Issues = "https://github.com/kyeshmz/inspect-robots-b601/issues"
Framework = "https://github.com/robocurve/inspect-robots"
Motorbridge = "https://motorbridge.seeedstudio.com"

# Inspect Robots discovers this by entry point; no import needed for `inspect-robots list`.
[project.entry-points."inspect_robots.embodiments"]
b601 = "inspect_robots_b601.embodiment:B601Embodiment"

[project.scripts]
inspect-robots-b601 = "inspect_robots_b601.cli:main"
inspect-robots-b601-preflight = "inspect_robots_b601.preflight:main"

[tool.hatch.build.targets.wheel]
packages = ["src/inspect_robots_b601"]

[tool.hatch.build.targets.sdist]
include = ["/src/inspect_robots_b601", "/tests", "/README.md", "/LICENSE"]


# ---------------------------------------------------------------------------
# Versioning: single-source the version from git tags via hatch-vcs (a release
# cuts a vX.Y.Z tag; nothing is committed to main).
# ---------------------------------------------------------------------------
[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
# Before/without tags (e.g. shallow checkouts), fall back instead of failing.
version_scheme = "guess-next-dev"
fallback_version = "0.0.0"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# tests/packaging checks an installed wheel and runs on its own (see README).
addopts = "-ra --strict-markers --ignore=tests/packaging"

# PyPI readme: identical to README.md except GitHub-only alert syntax
# (e.g. `> [!NOTE]`) is rewritten to bold blockquotes, which PyPI renders.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(?m)^> \[!NOTE\][ \t]*$'
replacement = '> **Note:**'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(?m)^> \[!TIP\][ \t]*$'
replacement = '> **Tip:**'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(?m)^> \[!IMPORTANT\][ \t]*$'
replacement = '> **Important:**'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(?m)^> \[!WARNING\][ \t]*$'
replacement = '> **Warning:**'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(?m)^> \[!CAUTION\][ \t]*$'
replacement = '> **Caution:**'

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/inspect_robots_b601"]

# Motorbridge ships no type information, and the RealSense modules are system packages
# imported lazily on the camera path.
[[tool.mypy.overrides]]
module = ["motorbridge", "motorbridge.*", "pyrealsense2", "pyrealsense2.*", "rs_depth"]
ignore_missing_imports = true

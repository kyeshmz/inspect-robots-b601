name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -v --junitxml=logs/offline.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-${{ matrix.python }}
          path: logs/

  distribution:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Check the installed wheel outside the checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/wheel-check"
          "$RUNNER_TEMP/wheel-check/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-check/bin/python" -I "$GITHUB_WORKSPACE/tests/packaging/test_installed.py"
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  ros-protocol:
    runs-on: ubuntu-22.04
    container: ros:humble-ros-base
    steps:
      - uses: actions/checkout@v4
      - name: Install test-only ROS dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git python3-pip python3-venv python3-colcon-common-extensions ros-humble-rosidl-default-generators ros-humble-control-msgs ros-humble-rmw-cyclonedds-cpp
      - name: Build only the pinned message package, never a hardware driver
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          git init /tmp/b601-message-source
          git -C /tmp/b601-message-source remote add origin https://github.com/Seeed-Projects/reBotArmController_ROS2.git
          git -C /tmp/b601-message-source fetch --depth 1 origin 7506dc0fc5c2a7787dcb974d89d13f9f49d16d61
          git -C /tmp/b601-message-source checkout --detach FETCH_HEAD
          mkdir -p /tmp/b601-message-overlay
          cd /tmp/b601-message-overlay
          colcon build --base-paths /tmp/b601-message-source/src/rebotarm_msgs --packages-select rebotarm_msgs
      - name: Run isolated fake-server action and evaluation tests
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source /tmp/b601-message-overlay/install/setup.bash
          python3 -m venv --system-site-packages .venv
          source .venv/bin/activate
          python -m pip install -e '.[test]'
          bash scripts/test-ros.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ros-protocol
          path: logs/
